[package]
name = "viewer"
version = "0.1.0"
description = "Real-time viewer for 3D Gaussian splats, meshes, and point clouds."
edition = "2021"
rust-version = "1.90"
repository = "https://github.com/ZhangAoCanada/3Dviewer"

[lib]
name = "viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
