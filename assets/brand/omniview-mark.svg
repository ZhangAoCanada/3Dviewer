<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title">
  <title id="title">Omniview</title>
  <!--
    Omniview icon, 1024 viewBox.
    Rounded tile (radius 22%) in #f8fafc. The ring is #14b8a6 — the brand teal
    between the app accent tokens (#0f766e light, #5eead4 dark) — with about
    12% padding. It stays solid from 1 o'clock counter-clockwise through the
    left side to 6 o'clock. Clockwise from 1 o'clock the outer arc becomes a
    3-row voxel grid that thins, then from 3 o'clock to 6 o'clock it dissolves
    into soft splat ovals that trail a little outside the ring.
    scripts/build-icons.mjs derives the transparent header mark and every PNG.
  -->
