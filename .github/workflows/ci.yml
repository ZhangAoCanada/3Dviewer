name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Browser smoke
        run: |
          set +e
          npm run test:e2e > /tmp/e2e.log 2>&1
          code=$?
          cat /tmp/e2e.log
          if [ "$code" -ne 0 ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const lines = readFileSync("/tmp/e2e.log", "utf8").split("\n");
              const picked = lines.filter((line) => /Error:|Expected:|Received:|✘|failed/.test(line)).slice(-8);
              const msg = picked.join(" | ").replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A").slice(0, 4000);
              console.log(`::error::${msg || "e2e failed"}`);
            '
            exit "$code"
          fi
